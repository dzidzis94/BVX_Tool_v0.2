<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVX Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>BVX Converter</h1>
            <p>Convert frame specification PDFs into Hundegger SC .bvx jobs</p>
        </header>

        <main class="card">
            <!-- Drag and drop zone -->
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p class="drop-text">Drag &amp; drop PDF here or <label for="file-input" class="file-label">browse</label></p>
                    <p id="file-name-display" class="file-name-display">No file selected</p>
                    <input type="file" id="file-input" accept=".pdf" class="file-input">
                </div>
            </div>

            <!-- Options & Action -->
            <div class="controls-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="skip-conflicts-checkbox" name="skip_conflicts">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-text"><code>--skip-conflicts</code></span>
                </label>

                <button id="process-btn" class="btn btn-primary" disabled>Process File</button>
            </div>

            <!-- Console window for report output -->
            <div class="console-section">
                <div class="console-header">
                    <span class="console-title">Report Output</span>
                    <span id="status-badge" class="badge">Ready</span>
                </div>
                <pre id="console-output" class="console-output">Ready. Upload a PDF file to process.</pre>
            </div>

            <!-- Download Button -->
            <div class="download-section">
                <a id="download-btn" href="#" class="btn btn-success btn-large btn-disabled" download hidden>
                    <svg class="download-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download .bvx File
                </a>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
